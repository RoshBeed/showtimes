name: Ingest all providers
# Manual dispatcher only. Each provider owns its schedule, history and badge.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to refresh
        type: choice
        options: [all, odeon, everyman, showcase, vue, picturehouse, cineworld, curzon, light, olympic, reel, princecharles, rio, lexi, phoenix, actone]
        default: all
      command:
        type: choice
        options: [check, run]
        default: check
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROVIDER: ${{ inputs.provider }}
      COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v7
      - name: Start the independent provider workflows
        run: |
          if [ "$PROVIDER" = all ]; then
            providers="odeon everyman showcase vue picturehouse cineworld curzon light olympic reel princecharles rio lexi phoenix actone"
          else
            providers="$PROVIDER"
          fi
          for provider in $providers; do
            gh workflow run "ingest-$provider.yml" --ref main -f "command=$COMMAND"
          done
