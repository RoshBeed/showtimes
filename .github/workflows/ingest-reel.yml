name: Ingest Reel
on:
  schedule:
    # Once a week, when its window opens (ingest/src/showtimes_ingest/policy.py),
    # and twice more an hour apart in case one fails; a check after a success
    # contacts nobody.
    - cron: "29 6-8 * * 2"
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      command:
        description: "check refreshes when due; run forces a collection"
        type: choice
        options: [check, run]
        default: check
concurrency:
  group: provider-workflow-reel
  queue: max
permissions:
  contents: write
  actions: write
jobs:
  ingest:
    if: github.ref == 'refs/heads/main' && ((vars.CHAINS_INGEST != 'false' && vars.REEL_INGEST != 'false') || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ingest-provider.yml
    with:
      provider: reel
      command: ${{ inputs.command || 'check' }}
      browser: false
      via-tailnet: false
      workflow: ingest-reel.yml
    secrets: inherit
