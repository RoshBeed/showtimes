name: Ingest ODEON
on:
  schedule:
    # Once a week, when its window opens (ingest/src/showtimes_ingest/policy.py),
    # and twice more an hour apart in case one fails; a check after a success
    # contacts nobody.
    - cron: "11 21-23 * * 3"
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      command:
        description: "check refreshes when due; run forces a collection"
        type: choice
        options: [check, run]
        default: check
concurrency:
  group: provider-workflow-odeon
  queue: max
permissions:
  contents: write
  actions: write
jobs:
  ingest:
    if: github.ref == 'refs/heads/main' && ((vars.ODEON_INGEST != 'false') || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ingest-provider.yml
    with:
      provider: odeon
      command: ${{ inputs.command || 'check' }}
      browser: true
      via-tailnet: true
      workflow: ingest-odeon.yml
    secrets: inherit
