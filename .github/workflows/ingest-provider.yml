name: Ingest provider
on:
  workflow_call:
    inputs:
      provider:
        type: string
        required: true
      command:
        type: string
        default: check
      browser:
        type: boolean
        default: false
      via-tailnet:
        type: boolean
        default: false
      validation:
        description: Build the production image without contacting or publishing to providers
        type: boolean
        default: false
jobs:
  ingest:
    # CI's validation run only builds the image: it names no chain.
    name: ${{ inputs.validation && 'Build ingest image' || format('Ingest {0}', inputs.provider) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # One run per provider at a time; providers run side by side, the tailnet ones
    # included (each run is its own ephemeral device). FIFO queueing keeps a
    # provider's later runs; GitHub's default single pending slot would cancel them.
    concurrency:
      group: ${{ inputs.validation && format('ingest-validation-{0}', github.run_id) || format('ingest-data-{0}', inputs.provider) }}
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      CHAIN: ${{ inputs.provider }}
      COMMAND: ${{ inputs.command }}
      ODEON_CINEMAS: ${{ vars.ODEON_CINEMAS }}
      TAILSCALE_EXIT_NODE: ${{ vars.TAILSCALE_EXIT_NODE }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the shared ingest container
        uses: ./.github/actions/ingest-image
        with:
          target: ${{ inputs.browser && 'runtime' || 'api' }}
      - name: Fetch this provider's stored listings
        if: ${{ !inputs.validation }}
        run: bash scripts/listings.sh download "$CHAIN"
      - name: Refresh this provider
        if: ${{ !inputs.validation }}
        id: ingest
        env:
          VIA: ${{ inputs.via-tailnet && format('{0}/scripts/via-tailnet.sh', github.workspace) || '' }}
        run: bash scripts/ingest-chain.sh "$CHAIN" "$COMMAND"
      # The changed file, failure records included, for Publish, the data release's only writer.
      - name: Hand the file to Publish
        if: ${{ always() && !inputs.validation && steps.ingest.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: chain-${{ inputs.provider }}
          path: data/${{ inputs.provider }}.sqlite
          retention-days: 7
