name: Publish site and listings
# Builds the site with the published listings inside it and puts it on GitHub Pages: the listings
# are files beside the page, so publishing them publishes the site. It runs on a push to main,
# by hand, and as the last stage of the Listings workflow, after that run's ingests, whose
# changed files it writes to the data release: the release's only writer.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      chains:
        description: The calling run's ingests left their changed files as artifacts named chain-<chain>
        type: boolean
        default: false
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # Three jobs: Claude cleans the titles across every chain's listings, then the site is built from
  # the listings and those titles, then it is deployed. Only the titles job may sign in to Claude or
  # write to the data release. Build and deploy are apart as in GitHub's own Pages workflow: a
  # deploy in the same job as its upload sometimes looked for the artifact before GitHub listed it.
  titles:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # titles.json on the data release
      id-token: write # Claude, through Workload Identity Federation
    outputs:
      published: ${{ steps.listings.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the listings the site carries
        run: bash scripts/listings.sh download
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Take this run's ingested files
        if: inputs.chains
        uses: actions/download-artifact@v5
        with:
          pattern: chain-*
          merge-multiple: true
          path: ingested
      - name: Publish them on the data release
        id: listings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in ingested/*.sqlite; do
            [ -e "$file" ] || continue
            mv "$file" data/
            bash scripts/listings.sh upload "$(basename "$file" .sqlite)"
          done
          # Until an ingest publishes listings there is nothing to show.
          if ! ls data/*.sqlite >/dev/null 2>&1; then exit 0; fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      # Claude cleans the titles it has not seen before (ingest/src/showtimes_ingest/titles.py);
      # Publish runs go one at a time, so only one run writes titles.json.
      # No API key: the job's GitHub identity token is exchanged for a short-lived Anthropic one
      # under the account's federation rule. The SDK reads the token file at each exchange, so a
      # fresh token is written every four minutes for as long as Claude runs.
      - name: Clean new film titles with Claude
        if: steps.listings.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_019xq5XaETGXpQpadSWiWu5C
          ANTHROPIC_ORGANIZATION_ID: 16ff528b-8d56-4918-b726-c5ef154fb64e
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_013U29rWXbxzfDi7WLqJPDPw
          ANTHROPIC_WORKSPACE_ID: wrkspc_01FdaqMPTvrKhtpGjXhoC28v
        run: |
          docker build --target api -f ingest/Dockerfile -t showtimes-ingest .
          oidc="$RUNNER_TEMP/oidc"
          mkdir -p "$oidc"
          identity() {
            curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$oidc/next"
            mv "$oidc/next" "$oidc/jwt"
          }
          identity
          # What the federation rule must match: the token's claims, never the token.
          cut -d. -f2 "$oidc/jwt" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq -c '{iss, aud, sub, repository, repository_owner, ref, workflow, job_workflow_ref, environment, event_name}' || true
          (while sleep 240; do identity; done) &
          refresher=$!
          before=$(sha256sum data/titles.json 2>/dev/null || true)
          status=0
          docker run --rm -v "$PWD/data:/data" -v "$oidc:/oidc:ro" -e ANTHROPIC_IDENTITY_TOKEN_FILE=/oidc/jwt \
            -e ANTHROPIC_FEDERATION_RULE_ID -e ANTHROPIC_ORGANIZATION_ID -e ANTHROPIC_SERVICE_ACCOUNT_ID -e ANTHROPIC_WORKSPACE_ID \
            --entrypoint uv showtimes-ingest run --no-sync showtimes-titles /data > "$RUNNER_TEMP/titles" || status=$?
          kill "$refresher"
          cat "$RUNNER_TEMP/titles"
          { echo '### Titles Claude cleaned'; echo; grep -v '^changed=' "$RUNNER_TEMP/titles"; } >> "$GITHUB_STEP_SUMMARY"
          # Each batch is saved as it is answered: what was decided is kept even when a later batch fails.
          if [ -f data/titles.json ] && [ "$(sha256sum data/titles.json)" != "$before" ]; then
            bash scripts/listings.sh upload-titles
          fi
          exit "$status"
  build:
    needs: titles
    if: needs.titles.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the listings and the titles Claude decided
        run: |
          bash scripts/listings.sh download
        env:
          GH_TOKEN: ${{ github.token }}
      # Every chain's file, exported as the compressed JSON document the site downloads.
      - name: Build the site in Docker
        run: |
          # The commit and branch, for the version the site shows (site/src/version.ts).
          docker run --rm -v "$PWD:/work" -w /work/site -e GITHUB_SHA -e GITHUB_REF_NAME \
            --mount type=volume,target=/work/site/node_modules,volume-nocopy \
            node:26-bookworm-slim sh -c 'npm ci && npm run listings && npm run build'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: pages
