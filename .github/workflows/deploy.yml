name: Deploy
# Builds the site with the published listings inside it and puts it on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The Ingest workflow, after it publishes new listings.
  workflow_call:
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the listings the site carries
        id: listings
        run: |
          bash scripts/listings.sh download
          # Until an ingest publishes listings there is nothing to show.
          if ! ls data/*.sqlite >/dev/null 2>&1; then exit 0; fi
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # Every chain's file, exported as the compressed JSON document the site downloads.
      - name: Build the site in Docker
        if: steps.listings.outputs.published == 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work/site \
            --mount type=volume,target=/work/site/node_modules,volume-nocopy \
            node:26-bookworm-slim sh -c 'npm ci && npm run listings && npm run build'
      - uses: actions/configure-pages@v6
        if: steps.listings.outputs.published == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.listings.outputs.published == 'true'
        with:
          path: site/dist
      - uses: actions/deploy-pages@v5
        if: steps.listings.outputs.published == 'true'
        id: pages
