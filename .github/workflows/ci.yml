name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m unittest discover -s tests -v
      # The scripts the Ingest workflow runs are otherwise first read on the day they are needed.
      - run: for script in ../scripts/*.sh; do bash -n "$script"; done
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The site in a real browser, driven by keys, clicks and scrolling.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --trace off
