[project]
name = "showtimes-ingest"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["playwright==1.64.1"]

[project.scripts]
showtimes-ingest = "showtimes_ingest.cli:main"

[dependency-groups]
dev = ["ruff>=0.17.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
